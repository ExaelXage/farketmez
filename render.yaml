services:
  - type: web
    name: farketmez
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class geventwebsocket.gunicorn.workers.GeventWebSocketWorker -w 1 --bind 0.0.0.0:$PORT wsgi:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FOURSQUARE_API_KEY
        sync: false
      - key: SOCKETIO_ASYNC_MODE
        value: gevent
      - key: PYTHON_VERSION
        value: 3.12.0
