<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f0f13" />
  <meta name="description" content="Nereye gideceksiniz? Artık farketmez — grup oylamasıyla karar verin." />
  <title>{% block title %}Farketmez{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <a href="/" class="logo">🎲 Farketmez</a>
    <span class="tagline">Ne yesek? Nereye gitsek? Karar ver, artık farketmez!</span>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  {% block scripts %}{% endblock %}
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
