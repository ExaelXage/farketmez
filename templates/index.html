{% extends "base.html" %}
{% block title %}Farketmez — Oda Oluştur{% endblock %}

{% block content %}
<div class="card card--hero">
  <h1>Nereye? Artık FARKETMEZ!</h1>
  <p class="subtitle">Arkadaşlarınla oda aç, yakındaki mekanları oylayın, kazanan yer belli olsun.</p>

  <form action="/create" method="POST" class="create-form">
    <div class="form-group">
      <label for="nickname">Takma adın</label>
      <input type="text" id="nickname" name="nickname" placeholder="Örn: pizza_sever_ali"
             maxlength="32" required autocomplete="off" />
    </div>

    <div class="form-group">
      <label>Ne arıyorsunuz?</label>
      <div class="category-picker">
        <label class="category-option">
          <input type="radio" name="category" value="food" checked />
          <span class="category-card">
            <span class="category-icon">🍕</span>
            <span>Yemek</span>
          </span>
        </label>
        <label class="category-option">
          <input type="radio" name="category" value="activity" />
          <span class="category-card">
            <span class="category-icon">🎳</span>
            <span>Etkinlik</span>
          </span>
        </label>
      </div>
    </div>

    <button type="submit" class="btn btn--primary btn--full">Oda Oluştur →</button>
  </form>
</div>
{% endblock %}
